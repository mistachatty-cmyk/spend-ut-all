name: Verify build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Loopers
        run: npm run validate:loopers
      - name: Check portable Looper animations
        run: npm run check:looper-animated
      - name: Validate Life RPG
        run: npm run validate:life-rpg
      - name: Validate careers
        run: npm run validate:careers
      - name: Validate education
        run: npm run validate:education
      - name: Validate freelance progression
        run: npm run validate:freelance
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
