<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" data-looper-id="lokdex:g1:008" data-looper-name="Espresso Bot" data-motion-signature="servo"><title>Espresso Bot — animated vector</title><style>.looper{transform-box:fill-box;transform-origin:512px 800px;animation:servo 2.1s steps(4,end) infinite}.steam{fill:none;stroke:#efffff;stroke-width:17;stroke-linecap:round;animation:steam 2.1s ease-out infinite}.s2{animation-delay:-.55s}.s3{animation-delay:-1.1s}.pulse{animation:pulse 1.8s ease-in-out infinite}.blink{animation:blink 5.2s steps(1,end) infinite}@keyframes servo{0%,100%{transform:translateY(0)}25%{transform:translateY(-7px)}50%{transform:translateY(-1px)}75%{transform:translateY(-10px)}}@keyframes steam{0%{opacity:0;transform:translateY(30px) scale(.82)}24%{opacity:.85}100%{opacity:0;transform:translateY(-74px) scale(1.08)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes blink{0%,42%,45%,100%{opacity:0}43%,44%{opacity:1}}@media(prefers-reduced-motion:reduce){.looper,.steam,.pulse,.blink{animation:none!important}}</style><g class="looper"><image href="master.svg" x="0" y="0" width="1024" height="1024" preserveAspectRatio="xMidYMid meet"/></g><g aria-hidden="true"><path class="steam" d="M760 550c-34-47 33-70 1-121"/><path class="steam s2" d="M810 551c-35-49 36-73 3-126"/><path class="steam s3" d="M857 557c-28-39 26-62 3-102"/><circle class="pulse" cx="298" cy="534" r="14" fill="#55f29f"/><circle class="pulse" cx="339" cy="534" r="14" fill="#ffd45d"/><path class="blink" d="M379 409h80m106 0h80" stroke="#081722" stroke-width="51" stroke-linecap="round"/></g></svg>