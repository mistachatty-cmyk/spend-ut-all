<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" data-looper-id="lokdex:g1:004" data-looper-name="Coin Cat" data-motion-signature="coin"><title>Coin Cat — animated vector</title><style>.looper{transform-box:fill-box;transform-origin:512px 785px;animation:idle 2.9s ease-in-out infinite}.coin{transform-box:fill-box;transform-origin:center;animation:toss 2.35s cubic-bezier(.36,.02,.2,1) infinite}.spark{transform-box:fill-box;transform-origin:center;animation:spark 2.35s ease-in-out infinite}.blink{animation:blink 6.3s steps(1,end) infinite}@keyframes idle{0%,100%{transform:translateY(0) rotate(0)}48%{transform:translateY(-10px) rotate(.4deg)}60%{transform:translateY(-7px) rotate(-.35deg)}}@keyframes toss{0%,15%,100%{transform:translate(0,0) rotate(0);opacity:.15}36%{transform:translate(-28px,-84px) rotate(145deg);opacity:1}58%{transform:translate(8px,-120px) rotate(280deg);opacity:1}78%{transform:translate(34px,-38px) rotate(355deg);opacity:.85}}@keyframes spark{0%,28%,80%,100%{opacity:0;transform:scale(.45) rotate(0)}48%{opacity:1;transform:scale(1) rotate(25deg)}62%{opacity:.55;transform:scale(.75) rotate(45deg)}}@keyframes blink{0%,51%,54%,100%{opacity:0}52%,53%{opacity:1}}@media(prefers-reduced-motion:reduce){.looper,.coin,.spark,.blink{animation:none!important}}</style><g class="looper"><image href="master.svg" x="0" y="0" width="1024" height="1024" preserveAspectRatio="xMidYMid meet"/></g><g aria-hidden="true"><circle class="coin" cx="780" cy="335" r="38" fill="#ffd45d" stroke="#5e3a1d" stroke-width="12"/><path class="coin" d="M780 311v50m-16-36c9-12 34-9 34 7 0 18-35 8-35 25 0 14 23 17 35 8" fill="none" stroke="#fff0a8" stroke-width="7" stroke-linecap="round"/><path class="spark" d="m843 207 14 28 29 14-29 14-14 29-14-29-29-14 29-14Z" fill="#fff2ad"/><path class="blink" d="M390 452h60m132-8h60" stroke="#4a2e1e" stroke-width="26" stroke-linecap="round"/></g></svg>